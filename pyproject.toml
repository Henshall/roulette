[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roulette-game"
dynamic = ["version"]
description = "A roulette game for the terminal, with a croupier you can bribe"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.6"
keywords = ["roulette", "terminal", "game", "casino", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]

[project.urls]
Homepage = "https://github.com/Henshall/roulette"
Issues = "https://github.com/Henshall/roulette/issues"

[project.scripts]
roulette = "roulette_game.game:run"

# The version comes from `__version__ = "..."` in the roulette script.
[tool.hatch.version]
path = "roulette"

# Ship the single-file script as roulette_game/game.py.
[tool.hatch.build.targets.wheel]
bypass-selection = true
core-metadata-version = "2.4"   # what PyPI's upload tools accept

[tool.hatch.build.targets.wheel.force-include]
"roulette" = "roulette_game/game.py"
"packaging/pypi/__init__.py" = "roulette_game/__init__.py"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = ["roulette", "man/", "packaging/pypi/", "README.md", "LICENSE", "pyproject.toml"]
